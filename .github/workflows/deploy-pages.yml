name: Deploy front a GitHub Pages

on:
  push:
    branches:
      - main
      - claude/clothing-ecommerce-mvp-mu76wd
  workflow_dispatch:

# Publica el build en la rama gh-pages (fuente clásica de GitHub Pages,
# no requiere habilitar Pages por API)
permissions:
  contents: write

# Solo un deploy a la vez; cancela los que queden en cola
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Instalar dependencias
        working-directory: front
        run: npm ci

      - name: Build estático (modo demo, sin backend)
        working-directory: front
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_DEMO: "true"
          # GitHub Pages sirve el sitio bajo /<nombre-del-repo>
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Desactivar Jekyll
        run: touch front/out/.nojekyll

      - name: Publicar en rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: front/out
          force_orphan: true
