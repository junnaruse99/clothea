name: Deploy front a GitHub Pages

on:
  push:
    branches:
      - main
      - claude/clothing-ecommerce-mvp-mu76wd
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Solo un deploy a la vez; cancela los que queden en cola
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Habilita GitHub Pages (source: GitHub Actions) si aún no lo está
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Instalar dependencias
        working-directory: front
        run: npm ci

      - name: Build estático (modo demo, sin backend)
        working-directory: front
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_DEMO: "true"
          # GitHub Pages sirve el sitio bajo /<nombre-del-repo>
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Desactivar Jekyll
        run: touch front/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: front/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
